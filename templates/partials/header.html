<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Budget Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Cały CSS tutaj (ten sam co wcześniej) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .app-container { display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: white; box-shadow: 2px 0 20px rgba(0,0,0,0.1); padding: 30px 20px; position: fixed; height: 100vh; left: 0; top: 0; overflow-y: auto; }
        .logo { font-size: 28px; font-weight: 700; margin-bottom: 50px; display: flex; align-items: center; gap: 10px; color: #667eea; }
        .logo .premium { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-menu { display: flex; flex-direction: column; gap: 15px; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 12px 20px; color: #4a5568; text-decoration: none; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; }
        .nav-item:hover, .nav-item.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .main-content { flex: 1; margin-left: 280px; padding: 30px 40px; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .header-actions h1 { font-size: 32px; color: white; }
        .quick-actions { display: flex; gap: 15px; }
        .btn-income, .btn-expense { padding: 12px 24px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; }
        .btn-income { background: #2ecc71; color: white; }
        .btn-expense { background: #e74c3c; color: white; }
        .btn-income:hover, .btn-expense:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .month-selector { background: rgba(255,255,255,0.2); padding: 15px 20px; border-radius: 15px; margin-bottom: 25px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
        .month-nav { background: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; }
        .current-month-display h2 { color: white; font-size: 24px; }
        .btn-today { background: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; color: #667eea; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: white; border-radius: 20px; padding: 25px; display: flex; align-items: center; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); transition: transform 0.3s ease; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-icon { width: 60px; height: 60px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .stat-card.income .stat-icon { background: #d5f4e6; color: #2ecc71; }
        .stat-card.expense .stat-icon { background: #fee; color: #e74c3c; }
        .stat-card.balance.positive .stat-icon { background: #d5f4e6; color: #2ecc71; }
        .stat-card.balance.negative .stat-icon { background: #fee; color: #e74c3c; }
        .stat-info { flex: 1; }
        .stat-label { display: block; color: #7f8c8d; font-size: 14px; margin-bottom: 5px; }
        .stat-value { font-size: 28px; font-weight: 700; color: #2c3e50; }
        .transactions-section { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .filters-section { background: rgba(255,255,255,0.2); padding: 20px; border-radius: 15px; margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        .filter-group label { color: white; font-weight: 600; }
        .filter-select { padding: 10px 15px; border: none; border-radius: 10px; min-width: 150px; }
        .btn-filter { padding: 10px 20px; background: white; color: #667eea; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .months-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 30px; }
        .month-card { background: white; border-radius: 15px; padding: 20px; cursor: pointer; transition: all 0.3s ease; }
        .month-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .month-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #f0f0f0; }
        .month-card-header h3 { color: #2c3e50; }
        .month-card-stats { display: flex; flex-direction: column; gap: 10px; }
        .month-stat { display: flex; justify-content: space-between; align-items: center; }
        .month-stat-label { color: #7f8c8d; font-size: 14px; }
        .month-stat-income { color: #2ecc71; font-weight: 600; }
        .month-stat-expense { color: #e74c3c; font-weight: 600; }
        .month-stat-balance { font-weight: 700; }
        .month-stat-balance.positive { color: #2ecc71; }
        .month-stat-balance.negative { color: #e74c3c; }
        .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #f0f0f0; flex-wrap: wrap; gap: 10px; }
        .transaction-item:hover { background: #f8f9fa; }
        .transaction-info { display: flex; align-items: center; gap: 15px; flex: 2; }
        .transaction-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .income-icon { background: #d5f4e6; color: #2ecc71; }
        .expense-icon { background: #fee; color: #e74c3c; }
        .transaction-details { display: flex; flex-direction: column; gap: 5px; }
        .transaction-desc { font-weight: 600; color: #2c3e50; }
        .transaction-category { font-size: 12px; color: #7f8c8d; }
        .transaction-date { font-size: 11px; color: #95a5a6; }
        .transaction-amount { font-weight: 700; font-size: 18px; min-width: 100px; text-align: right; }
        .positive-amount { color: #2ecc71; }
        .negative-amount { color: #e74c3c; }
        .transaction-actions { display: flex; gap: 10px; }
        .action-btn { width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer; }
        .edit-btn { background: #3498db; color: white; }
        .delete-btn { background: #e74c3c; color: white; }
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 25px; margin-top: 30px; }
        .stats-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .monthly-stats-item, .category-stats-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 50px auto; width: 90%; max-width: 500px; border-radius: 20px; }
        .modal-header { padding: 20px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .close-income, .close-expense, .close-delete { font-size: 28px; cursor: pointer; color: #7f8c8d; }
        .form-group { padding: 15px 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #2c3e50; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 10px; }
        .btn-premium-full { width: calc(100% - 40px); margin: 0 20px 20px 20px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .notification { position: fixed; top: 20px; right: 20px; padding: 15px 20px; border-radius: 10px; z-index: 2000; }
        .notification.success { background: #2ecc71; color: white; }
        .notification.error { background: #e74c3c; color: white; }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); position: fixed; z-index: 999; } .main-content { margin-left: 0; padding: 20px; } .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="app-container">
